```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaterialQR - Gestão Industrial</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="bg-gray-900 text-white min-h-screen">

    <!-- CABEÇALHO -->
    <header class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-6xl mx-auto px-6 py-5">

            <div class="flex items-center gap-3">

                <div class="bg-blue-600 w-12 h-12 rounded-xl flex items-center justify-center">

                </div>

                <div>
                    <h1 class="text-2xl font-bold">
                        MaterialQR
                    </h1>

                    <p class="text-gray-400 text-sm">
                        Gestão Industrial
                    </p>
                </div>

            </div>

        </div>
    </header>


    <main class="max-w-6xl mx-auto px-6 py-8">

        <!-- CADASTRO -->
        <section id="cadastro">

            <div class="mb-8">

                <h2 class="text-3xl font-bold mb-2">
                    Cadastro de Material
                </h2>

                <p class="text-gray-400">
                    Cadastre o material e gere automaticamente seu QR Code.
                </p>

            </div>


            <div class="bg-gray-800 rounded-2xl p-6 border border-gray-700">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">


                    <!-- NOME -->
                    <div>
                        <label class="block text-sm font-medium mb-2">
                            Nome do material
                        </label>

                        <input
                            id="mat-nome"
                            type="text"
                            placeholder="Ex.: Haste móvel de aperto"
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"
                        >
                    </div>


                    <!-- DIMENSÕES -->
                    <div>
                        <label class="block text-sm font-medium mb-2">
                            Dimensões
                        </label>

                        <input
                            id="mat-dimensoes"
                            type="text"
                            placeholder="Ex.: 500 x 200 x 100 mm"
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"
                        >
                    </div>


                    <!-- OS -->
                    <div>
                        <label class="block text-sm font-medium mb-2">
                            OS
                        </label>

                        <input
                            id="mat-os"
                            type="text"
                            placeholder="Ex.: PM03"
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"
                        >
                    </div>


                    <!-- CERTIFICADO -->
                    <div>
                        <label class="block text-sm font-medium mb-2">
                            Certificado
                        </label>

                        <input
                            id="mat-certificado"
                            type="text"
                            placeholder="Ex.: Certificado 12345"
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"
                        >
                    </div>


                    <!-- APLICAÇÃO -->
                    <div class="md:col-span-2">

                        <label class="block text-sm font-medium mb-2">
                            Aplicação
                        </label>

                        <textarea
                            id="mat-aplicacao"
                            rows="3"
                            placeholder="Descreva onde o material será utilizado..."
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"
                        ></textarea>

                    </div>


                    <!-- PDF -->
                    <div class="md:col-span-2">

                        <label class="block text-sm font-medium mb-2">
                            Certificado PDF
                        </label>

                        <input
                            id="mat-pdf-file"
                            type="file"
                            accept="application/pdf"
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-3"
                        >

                        <p class="text-xs text-gray-500 mt-2">
                            Tamanho máximo: 5 MB.
                        </p>

                    </div>

                </div>


                <!-- BOTÃO SALVAR -->
                <div class="mt-8">

                    <button
                        onclick="salvarMaterial()"
                        id="btn-salvar"
                        class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded-lg font-semibold transition"
                    >

                        <i class="fa-solid fa-floppy-disk mr-2"></i>

                        Salvar material

                    </button>

                </div>

            </div>

        </section>


        <!-- RESULTADO -->
        <section
            id="resultado"
            class="hidden mt-10"
        >

            <div class="bg-gray-800 rounded-2xl p-6 border border-gray-700">

                <h2 class="text-2xl font-bold mb-6">
                    Material cadastrado
                </h2>


                <div
                    id="dados-material"
                    class="grid grid-cols-1 md:grid-cols-2 gap-4"
                ></div>


                <!-- QR CODE -->
                <div class="mt-8">

                    <h3 class="text-xl font-semibold mb-4">
                        QR Code
                    </h3>

                    <div
                        class="bg-white p-6 rounded-xl w-fit"
                        id="qrcode"
                    ></div>

                </div>


                <!-- BOTÕES -->
                <div class="flex flex-wrap gap-3 mt-8">

                    <button
                        onclick="imprimirQR()"
                        class="bg-gray-700 hover:bg-gray-600 px-5 py-3 rounded-lg"
                    >

                        <i class="fa-solid fa-print mr-2"></i>

                        Imprimir QR Code

                    </button>


                    <button
                        onclick="novoMaterial()"
                        class="bg-blue-600 hover:bg-blue-700 px-5 py-3 rounded-lg"
                    >

                        <i class="fa-solid fa-plus mr-2"></i>

                        Novo material

                    </button>

                </div>

            </div>

        </section>


        <!-- CONSULTA -->
        <section
            id="consulta"
            class="hidden mt-10"
        >

            <div class="bg-gray-800 rounded-2xl p-6 border border-gray-700">

                <h2 class="text-2xl font-bold mb-6">
                    Informações do Material
                </h2>

                <div id="material-consulta"></div>

            </div>

        </section>

    </main>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://ikisvkyecgnekdangouc.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_rJSK0QR1lYy5EiHjZqR6QA_CwiId6NY";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VERIFICAÇÃO DE PDF
========================================================= */

function validarPDF(arquivo) {

    if (!arquivo) {
        return true;
    }

    const tamanhoMaximo =
        5 * 1024 * 1024;

    if (arquivo.size > tamanhoMaximo) {

        alert("O PDF não pode ter mais de 5 MB.");

        return false;
    }


    if (
        arquivo.type !== "application/pdf" &&
        !arquivo.name.toLowerCase().endsWith(".pdf")
    ) {

        alert("Selecione um arquivo PDF válido.");

        return false;
    }


    return true;
}


/* =========================================================
   NOME SEGURO PARA O ARQUIVO
========================================================= */

function gerarNomeSeguro(nomeOriginal) {

    let nome =
        nomeOriginal
            .replace(/\.[^/.]+$/, "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-zA-Z0-9_-]/g, "_")
            .replace(/_+/g, "_")
            .replace(/^_+|_+$/g, "");


    if (!nome) {

        nome = "certificado";

    }


    return Date.now() + "_" + nome + ".pdf";
}


/* =========================================================
   SALVAR MATERIAL
========================================================= */

async function salvarMaterial() {

    const btn =
        document.getElementById("btn-salvar");


    const nome =
        document.getElementById("mat-nome")
            .value
            .trim();


    const dimensoes =
        document.getElementById("mat-dimensoes")
            .value
            .trim();


    const os =
        document.getElementById("mat-os")
            .value
            .trim();


    const certificado =
        document.getElementById("mat-certificado")
            .value
            .trim();


    const aplicacao =
        document.getElementById("mat-aplicacao")
            .value
            .trim();


    const inputPDF =
        document.getElementById("mat-pdf-file");


    const arquivoPDF =
        inputPDF.files.length > 0
            ? inputPDF.files[0]
            : null;


    /* ===============================
       VALIDAÇÃO
    =============================== */

    if (!nome) {

        alert("Informe o nome do material.");

        return;
    }


    if (!dimensoes) {

        alert("Informe as dimensões.");

        return;
    }


    if (!os) {

        alert("Informe a OS.");

        return;
    }


    if (!aplicacao) {

        alert("Informe a aplicação.");

        return;
    }


    if (!validarPDF(arquivoPDF)) {

        return;
    }


    /* ===============================
       DESABILITA BOTÃO
    =============================== */

    btn.disabled = true;

    btn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Salvando...';


    try {

        let pdfUrl = null;

        let pdfNome = null;


        /* =================================================
           UPLOAD DO PDF
        ================================================= */

        if (arquivoPDF) {

            const nomeSeguro =
                gerarNomeSeguro(arquivoPDF.name);


            const upload =
                await db
                    .storage
                    .from("certificados")
                    .upload(
                        nomeSeguro,
                        arquivoPDF,
                        {
                            contentType: "application/pdf",
                            cacheControl: "3600",
                            upsert: false
                        }
                    );


            if (upload.error) {

                console.error(
                    "Erro no upload:",
                    upload.error
                );

                throw new Error(
                    "Erro ao enviar o PDF: " +
                    upload.error.message
                );
            }


            /* =============================================
               URL PÚBLICA
            ============================================= */

            const url =
                db
                    .storage
                    .from("certificados")
                    .getPublicUrl(nomeSeguro);


            pdfUrl =
                url.data.publicUrl;


            pdfNome =
                arquivoPDF.name;

        }


        /* =================================================
           SALVAR DADOS NO BANCO
        ================================================= */

        const resultado =
            await db
                .from("materiais")
                .insert({

                    nome: nome,

                    dimensoes: dimensoes,

                    os: os,

                    certificado:
                        certificado || null,

                    aplicacao: aplicacao,

                    pdf_url: pdfUrl,

                    pdf_nome: pdfNome

                })
                .select()
                .single();


        if (resultado.error) {

            console.error(
                "Erro no banco:",
                resultado.error
            );

            throw new Error(
                "Erro ao salvar material: " +
                resultado.error.message
            );
        }


        /* =================================================
           MOSTRAR RESULTADO
        ================================================= */

        mostrarResultado(
            resultado.data
        );


        /* =================================================
           LIMPAR FORMULÁRIO
        ================================================= */

        document
            .getElementById("mat-nome")
            .value = "";


        document
            .getElementById("mat-dimensoes")
            .value = "";


        document
            .getElementById("mat-os")
            .value = "";


        document
            .getElementById("mat-certificado")
            .value = "";


        document
            .getElementById("mat-aplicacao")
            .value = "";


        document
            .getElementById("mat-pdf-file")
            .value = "";


        alert(
            "Material cadastrado com sucesso!"
        );


    } catch (erro) {

        console.error(
            erro
        );


        alert(
            erro.message ||
            "Ocorreu um erro ao salvar o material."
        );

    } finally {

        btn.disabled = false;

        btn.innerHTML =
            '<i class="fa-solid fa-floppy-disk mr-2"></i> Salvar material';

    }

}


/* =========================================================
   MOSTRAR RESULTADO
========================================================= */

function mostrarResultado(material) {

    document
        .getElementById("cadastro")
        .classList
        .add("hidden");


    document
        .getElementById("resultado")
        .classList
        .remove("hidden");


    const container =
        document.getElementById(
            "dados-material"
        );


    container.innerHTML = `

        <div class="bg-gray-900 rounded-lg p-4">

            <p class="text-gray-400 text-sm">
                Nome
            </p>

            <p class="font-semibold mt-1">
                ${escaparHTML(material.nome)}
            </p>

        </div>


        <div class="bg-gray-900 rounded-lg p-4">

            <p class="text-gray-400 text-sm">
                Dimensões
            </p>

            <p class="font-semibold mt-1">
                ${escaparHTML(material.dimensoes)}
            </p>

        </div>


        <div class="bg-gray-900 rounded-lg p-4">

            <p class="text-gray-400 text-sm">
                OS
            </p>

            <p class="font-semibold mt-1">
                ${escaparHTML(material.os)}
            </p>

        </div>


        <div class="bg-gray-900 rounded-lg p-4">

            <p class="text-gray-400 text-sm">
                Certificado
            </p>

            <p class="font-semibold mt-1">
                ${escaparHTML(material.certificado || "-")}
            </p>

        </div>


        <div class="bg-gray-900 rounded-lg p-4 md:col-span-2">

            <p class="text-gray-400 text-sm">
                Aplicação
            </p>

            <p class="font-semibold mt-1">
                ${escaparHTML(material.aplicacao)}
            </p>

        </div>

    `;


    /* =====================================================
       QR CODE
    ===================================================== */

    const qr =
        document.getElementById("qrcode");


    qr.innerHTML = "";


    const urlQR =
        window.location.href.split("?")[0] +
        "?id=" +
        material.id;


    new QRCode(
        qr,
        {
            text: urlQR,
            width: 220,
            height: 220
        }
    );

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(texto) {

    const div =
        document.createElement("div");


    div.textContent =
        texto;


    return div.innerHTML;
}


/* =========================================================
   NOVO MATERIAL
========================================================= */

function novoMaterial() {

    document
        .getElementById("resultado")
        .classList
        .add("hidden");


    document
        .getElementById("cadastro")
        .classList
        .remove("hidden");


    window.scrollTo(
        {
            top: 0,
            behavior: "smooth"
        }
    );

}


/* =========================================================
   IMPRIMIR QR CODE
========================================================= */

function imprimirQR() {

    const qr =
        document.getElementById("qrcode");


    if (!qr.innerHTML) {

        alert(
            "QR Code não encontrado."
        );

        return;
    }


    const janela =
        window.open(
            "",
            "_blank"
        );


    janela.document.write(`

        <html>

        <head>

            <title>
                QR Code - Material
            </title>

            <style>

                body {

                    font-family: Arial;

                    display: flex;

                    flex-direction: column;

                    align-items: center;

                    justify-content: center;

                    min-height: 100vh;

                }

                img {

                    width: 300px;

                    height: 300px;

                }

            </style>

        </head>


        <body>

            ${qr.innerHTML}

            <script>

                window.onload = function() {

                    window.print();

                };

            <\/script>

        </body>

        </html>

    `);


    janela.document.close();

}


/* =========================================================
   CARREGAR MATERIAL PELO ID DO QR CODE
========================================================= */

async function carregarMaterial(id) {

    document
        .getElementById("cadastro")
        .classList
        .add("hidden");


    document
        .getElementById("resultado")
        .classList
        .add("hidden");


    document
        .getElementById("consulta")
        .classList
        .remove("hidden");


    const container =
        document.getElementById(
            "material-consulta"
        );


    container.innerHTML = `

        <div class="text-center py-10">

            <i class="fa-solid fa-spinner fa-spin text-3xl"></i>

            <p class="mt-4 text-gray-400">
                Carregando material...
            </p>

        </div>

    `;


    try {

        const resultado =
            await db
                .from("materiais")
                .select("*")
                .eq("id", id)
                .single();


        if (resultado.error) {

            throw new Error(
                "Material não encontrado."
            );

        }


        const material =
            resultado.data;


        let pdfHTML =
            `
                <div class="bg-gray-900 rounded-lg p-4">

                    <p class="text-gray-400 text-sm">
                        Certificado PDF
                    </p>

                    <p class="mt-2 text-gray-500">
                        Nenhum certificado cadastrado.
                    </p>

                </div>
            `;


        if (material.pdf_url) {

            pdfHTML = `

                <div class="bg-gray-900 rounded-lg p-4">

                    <p class="text-gray-400 text-sm">
                        Certificado PDF
                    </p>


                    <a
                        href="${escaparHTML(material.pdf_url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="inline-flex items-center mt-3 bg-blue-600 hover:bg-blue-700 px-5 py-3 rounded-lg font-semibold"
                    >

                        <i class="fa-solid fa-file-pdf mr-2"></i>

                        Abrir certificado

                    </a>

                </div>

            `;

        }


        container.innerHTML = `

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">


                <div class="bg-gray-900 rounded-lg p-5">

                    <p class="text-gray-400 text-sm">
                        Nome
                    </p>

                    <p class="text-lg font-semibold mt-1">
                        ${escaparHTML(material.nome)}
                    </p>

                </div>


                <div class="bg-gray-900 rounded-lg p-5">

                    <p class="text-gray-400 text-sm">
                        Dimensões
                    </p>

                    <p class="text-lg font-semibold mt-1">
                        ${escaparHTML(material.dimensoes)}
                    </p>

                </div>


                <div class="bg-gray-900 rounded-lg p-5">

                    <p class="text-gray-400 text-sm">
                        OS
                    </p>

                    <p class="text-lg font-semibold mt-1">
                        ${escaparHTML(material.os)}
                    </p>

                </div>


                <div class="bg-gray-900 rounded-lg p-5">

                    <p class="text-gray-400 text-sm">
                        Certificado
                    </p>

                    <p class="text-lg font-semibold mt-1">
                        ${escaparHTML(material.certificado || "-")}
                    </p>

                </div>


                <div class="bg-gray-900 rounded-lg p-5 md:col-span-2">

                    <p class="text-gray-400 text-sm">
                        Aplicação
                    </p>

                    <p class="text-lg font-semibold mt-1">
                        ${escaparHTML(material.aplicacao)}
                    </p>

                </div>


                <div class="md:col-span-2">

                    ${pdfHTML}

                </div>

            </div>

        `;


    } catch (erro) {

        console.error(
            erro
        );


        container.innerHTML = `

            <div class="text-center py-10">

                <i class="fa-solid fa-circle-exclamation text-red-500 text-4xl"></i>

                <p class="text-xl font-semibold mt-4">
                    Material não encontrado
                </p>

                <p class="text-gray-400 mt-2">
                    Verifique se o QR Code está correto.
                </p>

            </div>

        `;

    }

}


/* =========================================================
   VERIFICAR ID NA URL
========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    function() {

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const id =
            parametros.get("id");


        if (id) {

            carregarMaterial(id);

        }

    }
);

</script>

</body>
</html>
